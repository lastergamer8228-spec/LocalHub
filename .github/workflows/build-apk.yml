name: Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Test and build ARM64 preview
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PaacPreview=true --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: LocalHub-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish testing build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: LocalHub preview ${{ github.run_number }}
          prerelease: true
          body: |
            ARM64 debug preview from commit ${{ github.sha }}.
            JVM tests passed in this workflow. Device acceptance is still required.
            See docs/quality/controller-audit.md for known release blockers.
          files: app/build/outputs/apk/debug/app-debug.apk
