<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalHub Login</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/theme-pro.css" />
  <link rel="stylesheet" href="/animations.css" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/components.css" />
  <style>
    /* The login card was glassmorphic while the dashboard was an opaque
       console, so the very first thing a user saw did not look like the
       product they landed in. It now uses the same tonal surface. */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
    }

    .login-card { width: 100%; max-width: 400px; }

    .login-logo { text-align: center; margin-bottom: var(--sp-5); }

    .login-logo .brand-mark {
      width: var(--sp-8);
      height: var(--sp-8);
      margin: 0 auto var(--sp-3);
      border-radius: var(--r-md);
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      font-size: var(--fs-2xl);
      font-weight: var(--fw-bold);
    }
    .login-logo h1 {
      font-size: var(--fs-3xl);
      font-weight: var(--fw-bold);
      letter-spacing: -.02em;
    }
    .login-logo p {
      margin: var(--sp-1) 0 0;
      color: var(--muted);
      font-size: var(--fs-xs);
      font-family: var(--mono);
      overflow-wrap: anywhere;
    }

    .login-form { display: flex; flex-direction: column; gap: var(--sp-4); }

    .remember-row {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin: 0;
      font-size: var(--fs-xs);
      color: var(--text-2);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      font-weight: var(--fw-normal);
    }
    .remember-row input { width: 16px; height: 16px; accent-color: var(--accent); }

    .login-error {
      font-size: var(--fs-xs);
      color: var(--danger);
      min-height: var(--lh-xs);
    }
    .login-error:empty { display: none; }

    .login-info {
      margin-top: var(--sp-5);
      padding-top: var(--sp-4);
      border-top: 1px solid var(--border);
      font-size: var(--fs-xs);
      color: var(--muted);
      text-align: center;
      line-height: var(--lh-sm);
    }

    @media (max-width: 480px) {
      .login-wrap { padding: var(--sp-3); min-height: 100dvh; }
      .login-card { padding: var(--sp-5) var(--sp-4); }
      .login-logo h1 { font-size: var(--fs-2xl); }
    }
  </style>
</head>
<body class="lh-page">
  <div class="login-wrap">
    <div class="card login-card lh-pop">
      <div class="login-logo">
        <div class="brand-mark">L</div>
        <h1>LocalHub</h1>
        <p id="server-info">private local cloud</p>
      </div>
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="admin or username" autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <label class="remember-row">
          <input type="checkbox" id="remember" />
          <span>Remember on this browser</span>
        </label>
        <div class="login-error" id="login-error" role="alert" aria-live="assertive"></div>
        <button type="submit" class="login-btn lh-btn lh-ripple" id="login-btn">Sign In to LocalHub</button>
      </form>
      <div class="login-info">
        Personal Cloud · 100% Local &amp; Private<br/>
        All data is hosted directly on your device.
      </div>
    </div>
  </div>
  <script src="/animations.js"></script>
  <script>
    (function () {
      "use strict";
      var apiBase = location.protocol + "//" + location.host;

      // Prefill server info.
      fetch(apiBase + "/api/status").then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (st) {
          var el = document.getElementById("server-info");
          if (el) el.textContent = (st.name || "LocalHub") + " · " + (st.url || "");
        });

      // All users land on the rich Dashboard (Media Lounge, Local Connect, Reader & Notes, Quick Drop).
      function landing(role, token) {
        return "/?token=" + encodeURIComponent(token);
      }

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;
        var remember = document.getElementById("remember").checked;
        var btn = document.getElementById("login-btn");
        if (window.LH && LH.UI) LH.UI.setLoading(btn, true); else btn.disabled = true;
        fetch(apiBase + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, remember: remember })
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res && res.ok) {
            if (window.LH && LH.Motion) LH.Motion.success(btn);
            else if (window.LH_ANIM && window.LH_ANIM.success) window.LH_ANIM.success(btn);
            try { sessionStorage.setItem("lhtoken", res.token); } catch (e) {}
            try {
              if (remember) localStorage.setItem("lhtoken", res.token);
              else localStorage.removeItem("lhtoken");
            } catch (e) {}
            setTimeout(function () { window.location.href = landing(res.role, res.token); }, 180);
          } else {
            var err = document.getElementById("login-error");
            err.textContent = (res && res.error) || "Login failed.";
            if (res && res.attemptsLeft != null) err.textContent += " (" + res.attemptsLeft + " attempts left)";
            if (window.LH && LH.UI) LH.UI.setLoading(btn, false); else { btn.disabled = false; btn.textContent = "Sign In to LocalHub"; }
            if (window.LH && LH.Motion) LH.Motion.error(btn);
            else if (window.LH_ANIM && window.LH_ANIM.error) window.LH_ANIM.error(btn);
          }
        }).catch(function () {
          var err = document.getElementById("login-error");
          err.textContent = "Cannot reach server.";
          if (window.LH && LH.UI) LH.UI.setLoading(btn, false); else { btn.disabled = false; btn.textContent = "Sign In to LocalHub"; }
          if (window.LH && LH.Motion) LH.Motion.error(btn);
          else if (window.LH_ANIM && window.LH_ANIM.error) window.LH_ANIM.error(btn);
        });
      });
    })();
  </script>
</body>
</html>
