<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalHub Login</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/theme-pro.css" />
  <link rel="stylesheet" href="/animations.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, rgba(76, 154, 255, 0.08), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.05), transparent 50%),
                  var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(19, 26, 35, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 22px;
    }
    .login-logo .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      color: #06121f;
      display: inline-grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(76, 154, 255, 0.3);
      margin-bottom: 12px;
    }
    .login-logo h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .login-logo p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--mono);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .login-form input[type="text"],
    .login-form input[type="password"] {
      width: 100%;
      height: 40px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      font-size: 13.5px;
      transition: all 0.15s ease;
    }
    .login-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76, 154, 255, 0.15);
      background: var(--surface);
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-row input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .login-btn {
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      color: #06121f;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 16px rgba(76, 154, 255, 0.25);
    }
    .login-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .login-btn:active {
      transform: scale(0.99);
    }
    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      color: var(--danger);
      font-size: 12.5px;
      min-height: 18px;
      text-align: center;
      font-weight: 500;
    }
    .login-info {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .login-info b {
      color: var(--text);
    }
    @media (max-width: 480px) {
      .login-wrap {
        padding: 14px;
        min-height: 100dvh;
        min-height: 100vh;
      }
      .login-card {
        padding: 22px 16px;
        border-radius: 12px;
      }
      .login-logo {
        margin-bottom: 18px;
      }
      .login-logo h1 {
        font-size: 22px;
      }
      .login-form input[type="text"],
      .login-form input[type="password"] {
        height: 44px;
        font-size: 16px;
      }
      .login-btn {
        height: 46px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body class="lh-page">
  <div class="login-wrap">
    <div class="card login-card lh-pop">
      <div class="login-logo">
        <div class="brand-mark">L</div>
        <h1>LocalHub</h1>
        <p id="server-info">private local cloud</p>
      </div>
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="admin or username" autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <label class="remember-row">
          <input type="checkbox" id="remember" />
          <span>Remember on this browser</span>
        </label>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="login-btn lh-btn lh-ripple" id="login-btn">Sign In to LocalHub</button>
      </form>
      <div class="login-info">
        Personal Cloud · 100% Local &amp; Private<br/>
        All data is hosted directly on your device.
      </div>
    </div>
  </div>
  <script src="/animations.js"></script>
  <script>
    (function () {
      "use strict";
      var apiBase = location.protocol + "//" + location.host;

      // Prefill server info.
      fetch(apiBase + "/api/status").then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (st) {
          var el = document.getElementById("server-info");
          if (el) el.textContent = (st.name || "LocalHub") + " · " + (st.url || "");
        });

      // First-boot setup: if the default admin password is still active, prompt
      // the user to set a new administrator password before continuing.
      function checkSetup() {
        fetch(apiBase + "/api/auth/setup").then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (res) {
            if (res && res.needsSetup) {
              var u = prompt("This is LocalHub's first run. Create a new Administrator username:", "admin");
              var p = prompt("Set a new Administrator password (min 4 characters):");
              if (u && p && p.length >= 4) {
                fetch(apiBase + "/api/auth/login", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ username: "admin", password: "admin", remember: false })
                }).then(function (r) { return r.json(); }).then(function (login) {
                  if (login && login.ok) {
                    fetch(apiBase + "/api/auth/change-credentials", {
                      method: "POST",
                      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + login.token },
                      body: JSON.stringify({ currentPassword: "admin", target: "admin", username: u, password: p })
                    }).then(function (r) { return r.json(); }).then(function (chg) {
                      alert(chg && chg.ok ? "Administrator credentials set. Please log in." : ((chg && chg.error) || "Setup failed."));
                      try { fetch(apiBase + "/api/auth/logout", { method: "POST" }); } catch (e) {}
                      sessionStorage.removeItem("lhtoken"); localStorage.removeItem("lhtoken");
                    });
                  }
                });
              } else {
                alert("Administrator setup skipped. Default credentials still active (admin/admin).");
              }
            }
          });
      }
      checkSetup();

      // All users land on the rich Dashboard (Media Lounge, Local Connect, Reader & Notes, Quick Drop).
      function landing(role, token) {
        return "/?token=" + encodeURIComponent(token);
      }

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;
        var remember = document.getElementById("remember").checked;
        var btn = document.getElementById("login-btn");
        btn.disabled = true;
        btn.textContent = "Signing in…";
        fetch(apiBase + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, remember: remember })
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res && res.ok) {
            if (window.LH_ANIM && window.LH_ANIM.success) window.LH_ANIM.success(btn);
            try { sessionStorage.setItem("lhtoken", res.token); } catch (e) {}
            try {
              if (remember) localStorage.setItem("lhtoken", res.token);
              else localStorage.removeItem("lhtoken");
            } catch (e) {}
            setTimeout(function () { window.location.href = landing(res.role, res.token); }, 180);
          } else {
            var err = document.getElementById("login-error");
            err.textContent = (res && res.error) || "Login failed.";
            if (res && res.attemptsLeft != null) err.textContent += " (" + res.attemptsLeft + " attempts left)";
            btn.disabled = false;
            btn.textContent = "Login";
            if (window.LH_ANIM && window.LH_ANIM.error) window.LH_ANIM.error(btn);
          }
        }).catch(function () {
          var err = document.getElementById("login-error");
          err.textContent = "Cannot reach server.";
          btn.disabled = false;
          btn.textContent = "Login";
          if (window.LH_ANIM && window.LH_ANIM.error) window.LH_ANIM.error(btn);
        });
      });
    })();
  </script>
</body>
</html>
